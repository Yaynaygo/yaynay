<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter;color:#15131c;background:#f7f3ea;overflow:hidden;position:relative}
.dark{background:#100e15;color:#f3efe6}
svg.bg{position:absolute;inset:0;width:100%;height:100%}
.y{color:#0e9c62}.n{color:#f04a4a}.dark .y{color:#2fd08a}.dark .n{color:#ff6b6b}
.mono{font-family:'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase}
.h{font-family:'Inter Tight';font-weight:800;letter-spacing:-.045em;line-height:.95}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(21,19,28,.14);background:#fffdf8;border-radius:999px;padding:10px 18px;font-weight:600}
.dark .pill{background:#1f1b28;border-color:#3b334a}
.card{background:#fffdf8;border:1px solid #e8dfcd;border-radius:28px;box-shadow:0 30px 70px rgba(21,19,28,.14)}
.dark .card{background:#18151f;border-color:#2b2537;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.wrap{position:absolute;inset:0}
</style></head><body>
<div id="r"></div>
<script>
const v=new URLSearchParams(location.search).get('v')
const logo=(s,d)=>`<svg width="${s}" height="${s}" viewBox="0 0 32 32"><defs><linearGradient id="g${s}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${d?'#2c2539':'#fff'}"/><stop offset="1" stop-color="${d?'#17131f':'#f3ead8'}"/></linearGradient></defs><rect x="0.6" y="0.6" width="30.8" height="30.8" rx="8.6" fill="url(#g${s})" stroke="${d?'rgba(255,255,255,.12)':'rgba(21,19,28,.14)'}" stroke-width="1.2"/><path d="M11 5.5v21" stroke="${d?'#2fd08a':'#0e9c62'}" stroke-width="1.8" stroke-linecap="round"/><rect x="7.6" y="8.5" width="6.8" height="13" rx="2" fill="${d?'#2fd08a':'#0e9c62'}"/><path d="M21 9.5v18" stroke="${d?'#ff6b6b':'#f04a4a'}" stroke-width="1.8" stroke-linecap="round"/><rect x="17.6" y="13.5" width="6.8" height="10" rx="2" fill="${d?'#ff6b6b':'#f04a4a'}"/></svg>`
function candles(w,h,seed,op,d){let s=seed;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;let o='',p=h*0.62;const n=Math.ceil(w/40);for(let i=0;i<n;i++){const x=i*40+20;const c=Math.max(h*0.15,Math.min(h*0.85,h*0.62-Math.sin(i/4.2)*h*0.18-i*(h/n)*0.25+(r()-.5)*h*0.14));const up=c<p;const col=up?(d?'#2fd08a':'#0e9c62'):(d?'#ff6b6b':'#f04a4a');const t=Math.min(p,c),hh=Math.max(6,Math.abs(c-p));o+=`<line x1="${x}" x2="${x}" y1="${t-12-r()*22}" y2="${t+hh+12+r()*22}" stroke="${col}" stroke-width="3" stroke-linecap="round"/><rect x="${x-12}" y="${t}" width="24" height="${hh}" rx="5" fill="${col}"/>`;p=c}return `<svg class="bg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="opacity:${op}">${o}</svg>`}
const R=document.getElementById('r')
if(v==='avatar'){document.body.style.width='400px';document.body.style.height='400px';document.body.style.background='linear-gradient(160deg,#fffdf8,#efe5d0)';R.innerHTML=`<div class="wrap" style="display:grid;place-items:center">${logo(300)}</div>`}
if(v==='avatar-dark'){document.body.style.width='400px';document.body.style.height='400px';document.body.style.background='radial-gradient(circle at 50% 40%,#1c1726,#0b0a0f 70%)';R.innerHTML=`<div class="wrap" style="display:grid;place-items:center"><svg width="240" height="240" viewBox="5 3 22 26"><path d="M11 5.5v21" stroke="#2fd08a" stroke-width="1.8" stroke-linecap="round"/><rect x="7.6" y="8.5" width="6.8" height="13" rx="2" fill="#2fd08a"/><path d="M21 9.5v18" stroke="#ff6b6b" stroke-width="1.8" stroke-linecap="round"/><rect x="17.6" y="13.5" width="6.8" height="10" rx="2" fill="#ff6b6b"/></svg></div>`}
if(v==='banner-dark'){document.body.style.width='1500px';document.body.style.height='500px';document.body.classList.add('dark');document.body.style.background='radial-gradient(900px 400px at 85% 0%,rgba(47,208,138,.14),transparent 60%),radial-gradient(700px 380px at 20% 110%,rgba(255,107,107,.12),transparent 60%),#0b0a0f';R.innerHTML=candles(1500,500,7,.22,true)+`<div class="wrap" style="padding:0 90px 0 600px;display:flex;flex-direction:column;justify-content:center"><div class="h" style="font-size:118px;white-space:nowrap"><span class="y">Yay</span> or <span class="n">nay</span>?</div><div style="font-size:30px;color:#bcb4c4;margin-top:22px;font-weight:500">Polymarket, funded from your USDC on Arc.</div><div style="display:flex;gap:12px;margin-top:28px"><span class="pill">⚡ Deposit in ~1 min</span><span class="pill">↩ Withdraw to Arc · no POL</span><span class="pill">🔒 Non-custodial</span></div></div>`}
if(v==='gh-banner'||v==='gh-social'){const H=v==='gh-banner'?420:640;document.body.style.width='1280px';document.body.style.height=H+'px';document.body.classList.add('dark');document.body.style.background='radial-gradient(800px 380px at 88% 0%,rgba(47,208,138,.16),transparent 60%),radial-gradient(700px 360px at 10% 110%,rgba(255,107,107,.13),transparent 60%),#0b0a0f';R.innerHTML=candles(1280,H,9,.2,true)+`<div class="wrap" style="padding:0 90px;display:flex;flex-direction:column;justify-content:center"><div style="display:flex;align-items:center;gap:16px">${logo(v==='gh-banner'?56:72,true)}<span class="h" style="font-size:${v==='gh-banner'?46:58}px"><span class="y">Yay</span><span class="n">Nay</span></span></div><div class="h" style="font-size:${v==='gh-banner'?78:104}px;margin-top:${v==='gh-banner'?22:40}px"><span class="y">Yay</span> or <span class="n">nay</span>?</div><div style="font-size:${v==='gh-banner'?26:32}px;color:#bcb4c4;margin-top:16px">Trade Polymarket with your USDC on Arc. Non-custodial. No POL.</div>${v==='gh-social'?'<div style="display:flex;gap:12px;margin-top:34px"><span class="pill">⚡ Deposit in ~1 min</span><span class="pill">↩ Withdraw to Arc</span><span class="pill">🔒 You sign every step</span><span class="pill">yaynaygo.xyz</span></div>':''}</div>`}
if(v==='banner'){document.body.style.width='1500px';document.body.style.height='500px';R.innerHTML=candles(1500,500,7,.16)+`<div class="wrap" style="padding:0 90px 0 600px;display:flex;flex-direction:column;justify-content:center"><div class="h" style="font-size:118px;white-space:nowrap"><span class="y">Yay</span> or <span class="n">nay</span>?</div><div style="font-size:30px;color:#4a4554;margin-top:22px;font-weight:500">Polymarket, funded from your USDC on Arc.</div><div style="display:flex;gap:12px;margin-top:28px"><span class="pill">⚡ Deposit in ~1 min</span><span class="pill">↩ Withdraw to Arc · no POL</span><span class="pill">🔒 Non-custodial</span></div></div>`}
if(v==='launch'){document.body.style.width='1600px';document.body.style.height='900px';document.body.classList.add('dark');R.innerHTML=candles(1600,900,11,.18,true)+`<div class="wrap" style="padding:90px 110px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:18px">${logo(64,true)}<span class="h" style="font-size:52px"><span class="y">Yay</span><span class="n">Nay</span></span></div><div class="mono" style="color:#2fd08a;font-size:22px;margin-top:70px">● Live on Arc mainnet</div><div class="h" style="font-size:112px;margin-top:22px">Trade Polymarket<br>with your <span class="y">Arc USDC</span>.</div><div style="font-size:32px;color:#bcb4c4;margin-top:34px;max-width:1150px;line-height:1.4">Fund in about a minute, call any market, cash out back to Arc. No POL. No custody. You sign every step.</div><div style="margin-top:auto;font-family:'JetBrains Mono';font-size:26px;color:#8f879d">yaynaygo.xyz</div></div>`}
if(v==='flow'){document.body.style.width='1600px';document.body.style.height='900px';const step=(n,t,d,c)=>`<div class="card" style="flex:1;padding:44px 40px"><div class="mono" style="font-size:20px;color:${c}">Step ${n}</div><div class="h" style="font-size:58px;margin-top:16px">${t}</div><div style="font-size:26px;color:#4a4554;margin-top:18px;line-height:1.45">${d}</div></div>`;R.innerHTML=candles(1600,900,3,.1)+`<div class="wrap" style="padding:80px 90px;display:flex;flex-direction:column"><div class="h" style="font-size:84px">Arc → Polymarket → Arc</div><div style="font-size:30px;color:#4a4554;margin-top:16px">One flow. Three signatures you can read. Zero POL.</div><div style="display:flex;gap:28px;margin-top:60px">${step(1,'Fund','USDC leaves Arc through Circle CCTP and lands as pUSD in <b>your own</b> Polymarket wallet. ~1 min.','#0c8f57')}${step(2,'<span class="y">Yay</span> or <span class="n">nay</span>','Pick a side on any Polymarket market. Live order book, charts, smart-money view.','#c93636')}${step(3,'Cash out','Withdraw straight back to USDC on Arc. Polymarket’s relayer pays the gas.','#0c8f57')}</div><div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:14px">${logo(44)}<span class="h" style="font-size:36px"><span class="y">Yay</span><span class="n">Nay</span></span></span><span style="font-family:'JetBrains Mono';font-size:24px;color:#6b6474">yaynaygo.xyz</span></div></div>`}
if(v==='features'){document.body.style.width='1600px';document.body.style.height='900px';document.body.classList.add('dark');const f=(e,t,d)=>`<div class="card" style="padding:34px 34px"><div style="font-size:42px">${e}</div><div class="h" style="font-size:40px;margin-top:14px">${t}</div><div style="font-size:23px;color:#bcb4c4;margin-top:12px;line-height:1.45">${d}</div></div>`;R.innerHTML=candles(1600,900,21,.12,true)+`<div class="wrap" style="padding:80px 90px"><div class="h" style="font-size:80px">More than a bridge.</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:54px">${f('📈','Live markets','Order books and prices stream in real time. Line or candle charts.')}${f('🧠','Smart money','See which side Polymarket’s top traders hold, by position size.')}${f('🔔','Price alerts','Get pinged when Yes hits your number, even with the tab closed.')}${f('🌉','Top up from anywhere','ETH, USDT, EURC and more from 7 chains, straight to USDC on Arc.')}${f('📒','Call history','Every closed call with realized P&L and win rate.')}${f('🕯️','Quests','Learn the ropes, light every candle. Just for fun.')}</div></div>`}
</script></body></html>
